# The reverse proxy in front of the public depot web app (compose.yaml beside
# the nginx folder). Visitors come only through Cloudflare's proxy: ufw lets
# only Cloudflare's address ranges reach ports 80 and 443, and the real
# visitor's address, which the limits below count, comes from the
# CF-Connecting-IP header. The list of those ranges is the host's
# /etc/wpt-depot-web/cloudflare-real-ip.conf, which wpt-depot-cloudflare
# writes; nginx does not start without it.
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    access_log /var/log/nginx/access.log;
    server_tokens off;

    real_ip_header CF-Connecting-IP;
    include /etc/nginx/cloudflare/cloudflare-real-ip.conf;

    # Each request counts against one limit: the heavy reads that run SQL or
    # search the texts, the other writes, or the plain reads.
    map $request_method:$uri $depot_heavy {
        default "";
        ~^POST:/api/(sql|texts/search|texts/passages|texts/blocked)$ $binary_remote_addr;
    }
    map $request_method:$uri $depot_write {
        default "";
        ~^POST: $binary_remote_addr;
    }
    map $depot_heavy$depot_write $depot_read {
        "" $binary_remote_addr;
        default "";
    }
    limit_req_zone $depot_read zone=depot_read:10m rate=10r/s;
    limit_req_zone $depot_heavy zone=depot_heavy:10m rate=1r/s;
    limit_req_zone $depot_write zone=depot_write:10m rate=1r/s;
    limit_conn_zone $binary_remote_addr zone=depot_conn:10m;

    # any other name: the connection is closed with no answer
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        return 444;
    }
    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        ssl_reject_handshake on;
        return 444;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name depot.workers-intelligence-commons.org;

        # Let's Encrypt's HTTP-01 challenges, which certbot writes into the shared folder
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # the HTTPS server (https.conf), once its certificate exists (start.sh)
    include /run/nginx-https/*.conf;
}
