# The depot web app over HTTPS, with the Let's Encrypt certificate certbot
# keeps. start.sh enables this file only once the certificate exists.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name depot.workers-intelligence-commons.org;
    ssl_certificate /etc/letsencrypt/live/depot.workers-intelligence-commons.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/depot.workers-intelligence-commons.org/privkey.pem;

    client_max_body_size 100m;
    limit_req_status 429;
    limit_conn_status 429;
    limit_conn depot_conn 20;
    limit_req zone=depot_read burst=40 nodelay;
    limit_req zone=depot_heavy burst=5;
    limit_req zone=depot_write burst=10;

    # the app listens on 127.0.0.1:8780 (deploy/depot-web/Dockerfile), and receives
    # that address as the Host header
    location / {
        proxy_pass http://127.0.0.1:8780;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:8780;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 100s;
        proxy_send_timeout 100s;
        proxy_request_buffering on;
    }

    # A corpus's files and archive, and, on the frozen routes of datasets, a corpus's
    # files, the parts of an export and a sample, stream for as long as they last:
    # each piece goes on to the visitor as it comes, never into a temporary file, and
    # the connection stays open while the app takes up to 600 s between two pieces.
    # Range headers pass through to the app. The limits above apply here unchanged.
    location ~ ^/api/(builds/[^/]+/(files/|everything\.tar$)|datasets/[^/]+/(download/|export/|sample$)) {
        proxy_pass http://127.0.0.1:8780;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:8780;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
        proxy_request_buffering on;
    }
}
