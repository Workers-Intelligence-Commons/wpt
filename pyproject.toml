# Workspace root: holds no code. Libraries live in packages/, the apps in apps/: wpt (the wpt command), depot (the
# depot command and its web app), freight (the freight command) and dock (the dock command).
# Never built itself; it exists to carry the groups below.
[project]
name = "wpt-workspace"
version = "0.1.0"
license = "AGPL-3.0-or-later"
requires-python = ">=3.14"

[tool.uv]
package = false
# One PyTorch build per kind of hardware. They are all recorded in uv.lock;
# `uv run scripts/setup.py` installs the one this machine needs.
conflicts = [[{ group = "cpu" }, { group = "cuda" }, { group = "rocm" }, { group = "xpu" }]]

[tool.uv.workspace]
members = ["packages/*", "apps/*"]
exclude = ["packages/__pycache__", "apps/__pycache__"]  # the pattern above matches them, and uv refuses a member with no project

[dependency-groups]
# `uv sync` installs the apps, and through them every library (but not torch).
# pytest-testmon is pinned exactly: ci/startup/child_files.py extends one of its internals.
dev = ["wpt", "depot-app", "freight-app", "dock-app", "pytest>=8", "pytest-xdist>=3", "pytest-testmon==2.3.0", "moto[s3]>=5"]
cpu = ["torch>=2.14"]
# NVIDIA, CUDA 13.0: needs driver 580 or newer. The attention kernels: TileLang under Linux (DeepSeek's
# version; apache-tvm-ffi 0.1.10 and later break it on Python 3.14), Triton on Windows through triton-windows
# (torch brings Triton on Linux only), which also runs the other Triton kernels there.
cuda = ["torch>=2.14", "tilelang==0.1.8 ; sys_platform == 'linux'", "apache-tvm-ffi<0.1.10 ; sys_platform == 'linux'",
        "triton-windows>=3.8,<3.9 ; sys_platform == 'win32'"]
# AMD ROCm builds exist for Linux only. triton-rocm / triton-xpu are torch's own
# dependencies, named here only so the source rules below apply to them.
rocm = ["torch>=2.14 ; sys_platform == 'linux'", "triton-rocm ; sys_platform == 'linux'"]
xpu = ["torch>=2.14", "triton-xpu"]

[tool.uv.sources]
wpt-tokenizer = { workspace = true }
dock = { workspace = true }
dock-app = { workspace = true }
wpt-corpus = { workspace = true }
freight = { workspace = true }
freight-app = { workspace = true }
wpt-telemetry = { workspace = true }
depot = { workspace = true }
depot-app = { workspace = true }
wpt-orders = { workspace = true }
wpt-model = { workspace = true }
wpt-inference = { workspace = true }
wpt-training = { workspace = true }
wpt-utils = { workspace = true }
wic-utils = { workspace = true }
wpt-agent = { workspace = true }
wpt-worker = { workspace = true }
wpt = { workspace = true }
torch = [
    { index = "pytorch-cpu", group = "cpu" },
    { index = "pytorch-cuda", group = "cuda" },
    { index = "pytorch-rocm", group = "rocm" },
    { index = "pytorch-xpu", group = "xpu" },
]
triton-rocm = { index = "pytorch-rocm", group = "rocm" }
triton-xpu = { index = "pytorch-xpu", group = "xpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["packages", "apps"]
# test files in different members may share a name
addopts = "--import-mode=importlib"
# the corpus build of before the freight, which the tests build their corpora under corpora/ with and compare the
# freight's deliveries against: test code, so no part's library holds it
pythonpath = ["apps/wpt/tests/support"]
# ci/tests.py runs it apart, and only when a change touches image code (docs/architecture.md, "Checks")
markers = ["image_build: locks and builds a real image with Docker"]
