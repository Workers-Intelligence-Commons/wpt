[project]
name = "wpt-corpus"
version = "0.1.0"
description = "WPT's preparations, the programs the freight runs (wpt-vocabulary, wpt-tokens, wpt-count), and the token file format training reads"
license = "AGPL-3.0-or-later"
requires-python = ">=3.14"
# wpt-tokenizer: the vocabulary and the chat template; dock: the files a corpus's record names (shards.py,
# corpora.py);
# wic-utils: the one sha256 of a file; pyarrow, numpy: the token file format (shards.py)
dependencies = ["wpt-tokenizer", "dock", "wic-utils", "pyarrow>=21", "numpy>=2"]

[project.scripts]
wpt-vocabulary = "wpt_corpus.vocabulary:wpt_vocabulary"
wpt-tokens = "wpt_corpus.programs:wpt_tokens"
wpt-count = "wpt_corpus.programs:wpt_count"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
