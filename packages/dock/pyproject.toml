[project]
name = "dock"
version = "0.1.0"
description = "The dock: keeps what machines made (a local folder or an S3-compatible bucket), compressed: deliveries, corpora, models, run records and a cache of what can be rebuilt"
license = "AGPL-3.0-or-later"
requires-python = ">=3.14"
dependencies = ["wic-utils", "boto3>=1.40"]  # wic-utils: the one sha256 of a file, the file lock, parallel work, the .env file

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
