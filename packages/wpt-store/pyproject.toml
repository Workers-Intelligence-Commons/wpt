[project]
name = "wpt-store"
version = "0.1.0"
description = "Storage for everything WPT builds and trains (a local folder or an S3-compatible bucket), compressed: corpora, models, runs and a cache of what can be rebuilt"
license = "AGPL-3.0-or-later"
requires-python = ">=3.14"
dependencies = ["wpt-utils", "boto3>=1.40"]  # wpt-utils: the one sha256 of a file, the file lock, parallel work

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
