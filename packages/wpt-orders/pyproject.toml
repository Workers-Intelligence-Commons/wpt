[project]
name = "wpt-orders"
version = "0.1.0"
description = "WPT's model families and the images of agentic tasks: read, checked, each size of a family resolved to its model order, and what a model's numbers count"
license = "AGPL-3.0-or-later"
requires-python = ">=3.14"
dependencies = ["jsonschema>=4.23", "wic-utils"]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
