[project]
name = "wpt-utils"
version = "0.1.0"
description = "Helpers only WPT uses: the PyTorch device to run on, and a plug-in's settings typed from its defaults"
license = "AGPL-3.0-or-later"
requires-python = ">=3.14"
dependencies = ["wic-utils"]  # wic-utils: the outside programs wpt_utils.device starts; it needs torch, which comes from the root group that scripts/setup.py picks

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
