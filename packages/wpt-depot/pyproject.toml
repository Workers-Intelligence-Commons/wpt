[project]
name = "wpt-depot"
version = "0.1.0"
description = "WPT's depot: texts, items, decisions, libraries, erasures and datasets in Delta Lake tables read through DuckDB, and the corpus a dataset builds into the store"
license = "AGPL-3.0-or-later"
requires-python = ">=3.14"
# deltalake: the tables (delta-rs); duckdb: SQL reads over them; pyarrow: the rows both exchange; jsonschema: the
# content of an item against its kind; wpt-store, wpt-tokenizer: the corpus a dataset builds (corpus.py)
dependencies = ["deltalake>=1.6", "duckdb>=1.4", "pyarrow>=21", "jsonschema>=4.23", "wpt-store", "wpt-tokenizer",
                "wpt-utils"]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
