[project]
name = "dock-app"
version = "0.1.0"
description = "The dock command: a controller over the dock's api"
license = "AGPL-3.0-or-later"
requires-python = ">=3.14"
dependencies = ["dock", "wic-utils"]

[project.scripts]
dock = "dock_app:entry"

[tool.uv.build-backend]
module-name = "dock_app"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
